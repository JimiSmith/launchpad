[package]
name = "zellij-launchpad-core"
version = "0.5.1"
edition = "2024"
rust-version = "1.98.1"
publish = false

[workspace]
members = ["native"]
default-members = [".", "native"]
resolver = "2"

[dependencies]
shlex = "=2.0.1"
ignore = "=0.4.33"
ratatui = { version = "=0.30.2", default-features = false, features = ["unstable-rendered-line-info"] }
neo_frizbee = { version = "=0.13.1", default-features = false, features = ["safe_read"] }
unicode-segmentation = "1.12"
unicode-width = "0.2"
unicode-normalization = "0.1"

[profile.release]
# Optimize directory matching for throughput.
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
