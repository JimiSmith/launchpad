[package]
name = "zellij-launchpad"
version = "0.2.0"
edition = "2021"
rust-version = "1.98.1"
publish = false

[features]
# Development-only fault injection; absent from ordinary release builds.
worker-faults = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zellij-launchpad-core = { path = ".." }
zellij-tile = "=0.45.1"
ratatui = { version = "=0.30.2", default-features = false }

[dev-dependencies]
zellij-utils = "=0.45.1"
