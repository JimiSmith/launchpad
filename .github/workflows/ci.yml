name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install pinned Rust
        run: rustup show active-toolchain
      - name: Cache Cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-native-cargo-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
      - name: Install verification dependencies
        if: runner.os == 'Linux'
        run: |
          python3 -m venv target/verification-venv
          target/verification-venv/bin/pip install pyte==0.8.2
          mkdir -p target/zellij-bin
          curl --fail --location --retry 3 https://github.com/zellij-org/zellij/releases/download/v0.45.1/zellij-x86_64-unknown-linux-musl.tar.gz -o target/zellij.tar.gz
          curl --fail --location --retry 3 https://github.com/zellij-org/zellij/releases/download/v0.45.1/zellij-x86_64-unknown-linux-musl.sha256sum -o target/zellij.sha256sum
          tar -xzf target/zellij.tar.gz -C target/zellij-bin
          awk '{print $1 "  target/zellij-bin/zellij"}' target/zellij.sha256sum | sha256sum --check
          echo "$PWD/target/zellij-bin" >> "$GITHUB_PATH"
      - name: Native build, tests, lints and isolated live launches
        if: runner.os == 'Linux'
        run: bash tools/verify_native.sh
      - name: macOS and Windows build, tests and lints
        if: runner.os != 'Linux'
        run: |
          cargo fmt --all --check
          cargo test --workspace --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo build --release --locked -p zellij-launchpad
      - name: Retain failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-verification-${{ runner.os }}
          path: |
            target/native-*/screen.txt
            target/native-*/session.ansi
            target/native-*/executions.jsonl
