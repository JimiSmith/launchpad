name: Release native

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out tagged source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install pinned Rust
        run: rustup show active-toolchain
      - name: Check native release
        run: |
          cargo fmt --all --check
          cargo test --workspace --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo build --locked --release -p zellij-launchpad
      - name: Package native binary and checksum
        run: |
          mkdir -p dist/package
          cp target/release/zellij-launchpad README.md examples/config.toml dist/package/
          cp -r docs examples dist/package/
          tar -czf dist/zellij-launchpad-linux-x86_64.tar.gz -C dist/package zellij-launchpad README.md config.toml docs examples
          cd dist
          sha256sum zellij-launchpad-linux-x86_64.tar.gz > zellij-launchpad-linux-x86_64.tar.gz.sha256
          sha256sum --check zellij-launchpad-linux-x86_64.tar.gz.sha256
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "$RELEASE_TAG" --generate-notes
          fi
          gh release upload "$RELEASE_TAG" dist/zellij-launchpad-linux-x86_64.tar.gz dist/zellij-launchpad-linux-x86_64.tar.gz.sha256 --clobber
          prerelease=false
          if [[ "$RELEASE_TAG" == *-* ]]; then
            prerelease=true
          fi
          gh release edit "$RELEASE_TAG" --draft=false --prerelease="$prerelease"
