[package]
name = "zellij-launchpad"
version = "0.10.0"
edition = "2024"
rust-version = "1.98.1"
publish = false

[dependencies]
zellij-launchpad-core = { path = ".." }
ratatui = { version = "=0.30.2", default-features = false, features = ["crossterm_0_29"] }
crossterm = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
clap = { version = "4", features = ["derive"] }

[target.'cfg(unix)'.dependencies]
# The /dev/tty source stops reading at EOF; the default mio source spins forever on a hung-up terminal.
crossterm = { version = "0.29", features = ["use-dev-tty"] }
signal-hook = "0.3"
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Console"] }
